[package]
name = "clipy-local-moments"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pick the moments of a screen recording worth a screenshot: rules on device, spoken cues from an optional OpenAI-compatible model."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
