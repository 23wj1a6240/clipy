<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15161B"/>
      <stop offset="1" stop-color="#0A0B0F"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="772" cy="772" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4D29" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#FF4D29" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FF4D29" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cursorGrad" x1="320" y1="280" x2="720" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6A3D"/>
      <stop offset="0.55" stop-color="#FF4D29"/>
      <stop offset="1" stop-color="#FF2778"/>
    </linearGradient>
    <filter id="cursorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Dark squircle background, sits behind everything. macOS auto-masks
       to its rounded-square app-icon shape, but the explicit fill makes
       sure no light pixels leak through anti-aliased edges. -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bgGlow)"/>

  <!-- Cursor mark, rotated for energy. Same path as the web brand mark. -->
  <g transform="translate(512 506) rotate(-18) scale(22) translate(-16.5 -20)" filter="url(#cursorShadow)">
    <path d="M6 4 L6 32 L13 25 L18 36 L22 34.5 L18 23 L27 23 Z"
          fill="url(#cursorGrad)"/>
  </g>

  <!-- Record indicator (toward arrow tip) -->
  <circle cx="772" cy="772" r="110" fill="#FF4D29" opacity="0.45" filter="url(#dotGlow)"/>
  <circle cx="772" cy="772" r="72" fill="#FF4D29"/>
</svg>
